<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#171b16"/>
  <!-- Barber pole body -->
  <rect x="13" y="3" width="6" height="26" rx="3" fill="#1a1a1a"/>
  <!-- Pole stripes -->
  <clipPath id="poleClip">
    <rect x="13" y="3" width="6" height="26" rx="3"/>
  </clipPath>
  <g clip-path="url(#poleClip)">
    <rect x="11" y="0" width="3" height="32" fill="#c8102e"/>
    <rect x="14" y="0" width="3" height="32" fill="#ffffff"/>
    <rect x="17" y="0" width="3" height="32" fill="#003087"/>
    <rect x="20" y="0" width="3" height="32" fill="#ffffff"/>
  </g>
  <!-- Brass caps -->
  <rect x="12" y="3" width="8" height="4" rx="2" fill="#c9a227"/>
  <rect x="12" y="25" width="8" height="4" rx="2" fill="#c9a227"/>
  <!-- Small scissors hint bottom right -->
  <text x="20" y="30" font-size="9" fill="#c9a227" opacity="0.85">✂</text>
</svg>
